# Shared base for every workspace member. Dart-only (no Flutter include) so it
# is safe for the pure-Dart packages; each package layers its own framework
# lints on top via `include: ../../analysis_options.yaml`.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - public_member_api_docs
